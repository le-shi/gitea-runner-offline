# Gitea Runner 离线部署示例。
# 启动前复制 examples/runner.env.example 为 .env，并填写 Gitea 地址和注册令牌。
services:
  # 一次性把镜像内置的 BuildKit、数据库等归档加载到宿主机 Docker。
  # 已经手工执行过 load-offline-images 时，可以删除这个服务和 depends_on。
  offline-images-init:
    image: ghcr.io/le-shi/gitea-runner:3.0-offline
    entrypoint: ["/usr/local/bin/load-offline-images"]
    network_mode: none
    restart: "no"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  runner:
    image: ghcr.io/le-shi/gitea-runner:3.0-offline
    restart: unless-stopped
    depends_on:
      offline-images-init:
        condition: service_completed_successfully
    environment:
      GITEA_INSTANCE_URL: "${GITEA_INSTANCE_URL}"
      GITEA_RUNNER_REGISTRATION_TOKEN: "${GITEA_RUNNER_REGISTRATION_TOKEN}"
      GITEA_RUNNER_NAME: "${GITEA_RUNNER_NAME:-offline-runner-01}"
      # offline 使用同一个离线镜像创建隔离 Job Container。
      # offline-host 直接在 Runner 容器运行，适合 Docker 构建或排障，但隔离性较弱。
      GITEA_RUNNER_LABELS: "offline:docker://ghcr.io/le-shi/gitea-runner:3.0-offline,offline-host:host"
    volumes:
      # Runner 注册状态和配置持久化目录。
      - ./runner-data:/data
      # Runner 创建 Job Container、运行 Docker 构建所需。
      - /var/run/docker.sock:/var/run/docker.sock

