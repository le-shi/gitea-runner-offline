name: Build offline Gitea Runner image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/gitea-runner

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate lock file
        shell: bash
        run: |
          set -euo pipefail
          awk -F'|' '
            /^[[:space:]]*(#|$)/ { next }
            NF != 4 { print "invalid field count at line " NR; exit 1 }
            $3 !~ /^[0-9a-f]{40}$/ { print "invalid SHA at line " NR; exit 1 }
          ' actions.lock
      - name: Check pinned commits exist
        shell: bash
        run: |
          set -euo pipefail
          while IFS='|' read -r cache_name repository commit friendly_ref; do
            case "$cache_name" in ''|'#'*) continue ;; esac
            git ls-remote --exit-code "$repository" "$commit" >/dev/null || {
              rm -rf /tmp/action-check
              git init --quiet /tmp/action-check
              git -C /tmp/action-check remote add origin "$repository"
              git -C /tmp/action-check fetch --quiet --depth 1 origin "$commit"
              rm -rf /tmp/action-check
            }
          done < actions.lock

  smoke-test:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build local AMD64 test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: gitea-runner-offline:test
          cache-from: type=gha,scope=smoke-amd64
          cache-to: type=gha,mode=max,scope=smoke-amd64
      - name: Verify image contents
        run: docker run --rm --entrypoint /usr/local/bin/verify-offline-image gitea-runner-offline:test

  publish:
    needs: smoke-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=3.0-offline
            type=sha,prefix=3.0-offline-
            type=ref,event=tag
      - name: Build and publish multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=publish
          cache-to: type=gha,mode=max,scope=publish
          provenance: mode=max
          sbom: true
