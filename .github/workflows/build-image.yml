name: Build offline Gitea Runner image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/gitea-runner

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      runner_version: ${{ steps.versions.outputs.runner_version }}
      runner_image: ${{ steps.versions.outputs.runner_image }}
      image_version: ${{ steps.versions.outputs.image_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Load and validate versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          source versions.env
          [[ "$RUNNER_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$IMAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$RUNNER_VERSION" == "$IMAGE_VERSION" ]]
          echo "runner_version=$RUNNER_VERSION" >> "$GITHUB_OUTPUT"
          echo "runner_image=gitea/runner:$RUNNER_VERSION" >> "$GITHUB_OUTPUT"
          echo "image_version=$IMAGE_VERSION" >> "$GITHUB_OUTPUT"
      - name: Validate lock file
        shell: bash
        run: |
          set -euo pipefail
          awk -F'|' '
            /^[[:space:]]*(#|$)/ { next }
            NF != 4 && NF != 5 { print "invalid field count at line " NR; exit 1 }
            $3 !~ /^[0-9a-f]{40}$/ { print "invalid SHA at line " NR; exit 1 }
          ' actions.lock
          awk -F'|' '
            /^[[:space:]]*(#|$)/ { next }
            NF != 3 { print "invalid offline image field count at line " NR; exit 1 }
          ' offline-images.lock
          test "$(grep -Evc '^[[:space:]]*(#|$)' offline-images.lock)" -eq 2
          awk -F'|' '
            /^[[:space:]]*(#|$)/ { next }
            NF != 3 { print "invalid Docker CLI field count at line " NR; exit 1 }
            $1 !~ /^[0-9]+\.[0-9]+\.[0-9]+$/ { print "invalid Docker CLI version at line " NR; exit 1 }
            $2 !~ /^[0-9a-f]{64}$/ || $3 !~ /^[0-9a-f]{64}$/ { print "invalid Docker CLI SHA-256 at line " NR; exit 1 }
          ' docker-cli.lock
          grep -Eqv '^[[:space:]]*(#|$)' dependency-seeds/*.txt
          ! grep -REn '(^|[@:=])(latest|stable)$' dependency-seeds
          awk '!/^[[:space:]]*(#|$)/ && $0 !~ /^(@[^/]+\/[^@]+|[^@]+)@[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$/ { print "invalid npm seed at line " NR; exit 1 }' dependency-seeds/node-packages.txt
          awk '!/^[[:space:]]*(#|$)/ && $0 !~ /^[A-Za-z0-9_.-]+==[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$/ { print "invalid Python seed at line " NR; exit 1 }' dependency-seeds/python-requirements.txt
          awk '!/^[[:space:]]*(#|$)/ && $0 !~ /^.+@v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$/ { print "invalid Go seed at line " NR; exit 1 }' dependency-seeds/go-tools.txt
          awk '!/^[[:space:]]*(#|$)/ && $0 !~ /^[A-Za-z0-9_-]+@[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$/ { print "invalid Rust seed at line " NR; exit 1 }' dependency-seeds/rust-tools.txt
          awk '!/^[[:space:]]*(#|$)/ && $0 !~ /^[A-Za-z0-9_-]+:[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$/ { print "invalid Ruby seed at line " NR; exit 1 }' dependency-seeds/ruby-gems.txt
      - name: Validate capability report renderer
        shell: bash
        run: |
          set -euo pipefail
          jq -n '{
            architecture: "amd64",
            runner: "test",
            job_environment: {image_os: "debian12"},
            toolchains: {node: ["20.20.2", "24.19.0"]},
            docker: {
              default: "Docker version 28.5.1",
              available_cli: [{version: "27.5.1"}, {version: "28.5.1"}, {version: "29.1.3"}],
              buildx: "v0.30.1",
              compose: "v2.40.3"
            },
            actions: [1],
            dependency_seeds: {"node-packages.txt": ["typescript@5.9.3"]},
            offline_images: [1, 2]
          }' >/tmp/capabilities.json
          bash scripts/show-offline-capabilities.sh /tmp/capabilities.json | grep -F 'available: 27.5.1, 28.5.1, 29.1.3'
      - name: Check pinned commits exist
        shell: bash
        run: |
          set -euo pipefail
          while IFS='|' read -r cache_name repository commit friendly_ref runtime_cache_key; do
            case "$cache_name" in ''|'#'*) continue ;; esac
            git ls-remote --exit-code "$repository" "$commit" >/dev/null || {
              rm -rf /tmp/action-check
              git init --quiet /tmp/action-check
              git -C /tmp/action-check remote add origin "$repository"
              git -C /tmp/action-check fetch --quiet --depth 1 origin "$commit"
              rm -rf /tmp/action-check
            }
          done < actions.lock

  build-platform:
    needs: validate
    env:
      OFFLINE_TAG: ${{ needs.validate.outputs.image_version }}-offline
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate platform image metadata
        id: platform-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.OFFLINE_TAG }}-${{ matrix.arch }}
            type=sha,prefix=${{ env.OFFLINE_TAG }}-${{ matrix.arch }}-
      - name: Build native platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' }}
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.platform-meta.outputs.tags }}
          build-args: |
            RUNNER_IMAGE=${{ needs.validate.outputs.runner_image }}
            RUNNER_VERSION=${{ needs.validate.outputs.runner_version }}
          cache-from: type=gha,scope=full-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=full-${{ matrix.arch }}
          provenance: mode=max
          sbom: false
          secrets: |
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
      - name: Verify image contents
        shell: bash
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}:${OFFLINE_TAG}-${{ matrix.arch }}"
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            docker pull "$image"
          fi
          docker run --rm --network none --entrypoint /usr/local/bin/verify-offline-image "$image"
          docker run --rm --network none --entrypoint /usr/local/bin/verify-offline-setup-actions "$image"
          docker run --rm --network none --entrypoint /usr/local/bin/verify-offline-dependency-caches "$image"
          docker run --rm --network none --privileged \
            -v /var/run/docker.sock:/var/run/docker.sock \
            --entrypoint /usr/local/bin/verify-offline-docker-images "$image"
      - name: Enforce maximum layer size
        shell: bash
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}:${OFFLINE_TAG}-${{ matrix.arch }}"
          max_bytes=$((2 * 1024 * 1024 * 1024))
          largest_layer="$(
            docker history --no-trunc --format '{{.Size}}\t{{.CreatedBy}}' "$image" |
              python3 -c '
          import re
          import sys

          factors = {
              "B": 1,
              "kB": 1000,
              "MB": 1000**2,
              "GB": 1000**3,
              "TB": 1000**4,
          }
          largest = 0
          largest_command = ""
          for raw in sys.stdin:
              value, _, command = raw.rstrip("\n").partition("\t")
              match = re.fullmatch(r"([0-9]+(?:\.[0-9]+)?)([kMGT]?B)", value)
              if not match:
                  raise SystemExit(f"Invalid Docker layer size: {value}")
              size = round(float(match.group(1)) * factors[match.group(2)])
              if size > largest:
                  largest = size
                  largest_command = command
          print(f"Largest layer command: {largest_command}", file=sys.stderr)
          print(largest)
          '
          )"
          echo "Largest unpacked layer: ${largest_layer} bytes"
          test "${largest_layer}" -le "${max_bytes}"
      - name: Generate compressed platform SBOM
        shell: bash
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}:${OFFLINE_TAG}-${{ matrix.arch }}"
          mkdir -p sbom
          docker run --rm --network none \
            --env SYFT_CHECK_FOR_APP_UPDATE=false \
            --entrypoint syft \
            "$image" dir:/ --output spdx-json \
            | gzip -9 > "sbom/gitea-runner-${OFFLINE_TAG}-${{ matrix.arch }}.spdx.json.gz"
      - name: Upload platform SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.arch }}
          path: sbom/*.spdx.json.gz
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [validate, build-platform]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    env:
      OFFLINE_TAG: ${{ needs.validate.outputs.image_version }}-offline
    steps:
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.OFFLINE_TAG }}
            type=sha,prefix=${{ env.OFFLINE_TAG }}-
            type=ref,event=tag
      - name: Publish multi-platform manifest
        shell: bash
        run: |
          set -euo pipefail
          sources=(
            "${REGISTRY}/${IMAGE_NAME}:${OFFLINE_TAG}-amd64"
            "${REGISTRY}/${IMAGE_NAME}:${OFFLINE_TAG}-arm64"
          )
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            docker buildx imagetools create --tag "$tag" "${sources[@]}"
          done <<< '${{ steps.meta.outputs.tags }}'
      - name: Inspect published manifest
        run: docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:${OFFLINE_TAG}"
