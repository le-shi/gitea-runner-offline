name: Build offline Gitea Runner image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/gitea-runner

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate lock file
        shell: bash
        run: |
          set -euo pipefail
          awk -F'|' '
            /^[[:space:]]*(#|$)/ { next }
            NF != 4 { print "invalid field count at line " NR; exit 1 }
            $3 !~ /^[0-9a-f]{40}$/ { print "invalid SHA at line " NR; exit 1 }
          ' actions.lock
      - name: Check pinned commits exist
        shell: bash
        run: |
          set -euo pipefail
          while IFS='|' read -r cache_name repository commit friendly_ref; do
            case "$cache_name" in ''|'#'*) continue ;; esac
            git ls-remote --exit-code "$repository" "$commit" >/dev/null || {
              rm -rf /tmp/action-check
              git init --quiet /tmp/action-check
              git -C /tmp/action-check remote add origin "$repository"
              git -C /tmp/action-check fetch --quiet --depth 1 origin "$commit"
              rm -rf /tmp/action-check
            }
          done < actions.lock

  build-platform:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build native platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' }}
          platforms: ${{ matrix.platform }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:3.0-offline-${{ matrix.arch }}
          cache-from: type=gha,scope=full-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=full-${{ matrix.arch }}
          provenance: mode=max
          sbom: true
      - name: Verify image contents
        shell: bash
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}:3.0-offline-${{ matrix.arch }}"
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            docker pull "$image"
          fi
          docker run --rm --network none --entrypoint /usr/local/bin/verify-offline-image "$image"

  publish:
    needs: build-platform
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=3.0-offline
            type=sha,prefix=3.0-offline-
            type=ref,event=tag
      - name: Publish multi-platform manifest
        shell: bash
        run: |
          set -euo pipefail
          sources=(
            "${REGISTRY}/${IMAGE_NAME}:3.0-offline-amd64"
            "${REGISTRY}/${IMAGE_NAME}:3.0-offline-arm64"
          )
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            docker buildx imagetools create --tag "$tag" "${sources[@]}"
          done <<< '${{ steps.meta.outputs.tags }}'
      - name: Inspect published manifest
        run: docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:3.0-offline"
