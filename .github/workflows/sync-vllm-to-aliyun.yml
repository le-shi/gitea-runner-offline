name: 同步 vLLM 镜像到阿里云

on:
  workflow_dispatch:
    inputs:
      target_registry:
        description: "阿里云 Registry 地址，不含 https:// 和路径"
        required: true
        default: crpi-a3l6m194vblqfo03.cn-hangzhou.personal.cr.aliyuncs.com
        type: string
      target_username:
        description: "阿里云 Registry 用户名；密码沿用 TARGET_REGISTRY_PASSWORD Secret"
        required: true
        type: string

permissions: {}

env:
  SOURCE_IMAGE: ghcr.io/local-inference-lab/vllm:karmic-kraken-beta-20261016.2
  SOURCE_DIGEST: sha256:f5f9efe1b10ec7b853a495e66b7dbf15ff54f62741e444dea0b44e16736a10a9
  TARGET_NAMESPACE: gh-leshi

jobs:
  sync-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      TARGET_REGISTRY: ${{ inputs.target_registry }}
      TARGET_USERNAME: ${{ inputs.target_username }}
    steps:
      - name: 校验目标地址和凭据
        shell: bash
        env:
          TARGET_REGISTRY_PASSWORD: ${{ secrets.TARGET_REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "DOCKER_CONFIG=$RUNNER_TEMP/vllm-docker-config" >> "$GITHUB_ENV"
          [[ "$TARGET_REGISTRY" =~ ^[a-z0-9]([a-z0-9.-]*[a-z0-9])?\.aliyuncs\.com$ ]] || {
            echo "目标必须是阿里云 Registry 域名，不能包含协议、端口或路径" >&2
            exit 1
          }
          [[ -n "${TARGET_USERNAME//[[:space:]]/}" ]] || {
            echo "请填写阿里云 Registry 用户名" >&2
            exit 1
          }
          [[ -n "$TARGET_REGISTRY_PASSWORD" ]] || {
            echo "缺少仓库 Secret：TARGET_REGISTRY_PASSWORD" >&2
            exit 1
          }
          # 仅替换路径分隔符，保留原始标签作为目标镜像标签。
          target_image="${TARGET_REGISTRY}/${TARGET_NAMESPACE}/${SOURCE_IMAGE//\//_}"
          echo "TARGET_IMAGE=$target_image" >> "$GITHUB_ENV"
          echo "目标镜像：$target_image"

      - name: 准备 Runner 磁盘空间
        shell: bash
        run: |
          set -euo pipefail
          # 本任务运行在临时 GitHub Hosted Runner，仅移除不使用的预装 SDK。
          for directory in /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; do
            sudo rm -rf -- "$directory"
          done
          docker_root="$(docker info --format '{{.DockerRootDir}}')"
          df -h / "$docker_root"

      - name: Docker 拉取源镜像
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 100m \
            docker pull --platform linux/amd64 "${SOURCE_IMAGE}@${SOURCE_DIGEST}"
          actual_arch="$(docker image inspect "${SOURCE_IMAGE}@${SOURCE_DIGEST}" --format '{{.Architecture}}')"
          [[ "$actual_arch" == amd64 ]]
          source_id="$(docker image inspect "${SOURCE_IMAGE}@${SOURCE_DIGEST}" --format '{{.Id}}')"
          echo "SOURCE_IMAGE_ID=$source_id" >> "$GITHUB_ENV"
          docker image inspect "${SOURCE_IMAGE}@${SOURCE_DIGEST}" --format 'source={{.Id}} size={{.Size}} arch={{.Architecture}}'

      - name: 登录阿里云 Registry
        shell: bash
        env:
          TARGET_REGISTRY_PASSWORD: ${{ secrets.TARGET_REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p -- "$DOCKER_CONFIG"
          printf '%s' "$TARGET_REGISTRY_PASSWORD" |
            timeout 2m docker login --password-stdin \
              --username "$TARGET_USERNAME" "$TARGET_REGISTRY"

      - name: Docker 打标签并推送
        shell: bash
        run: |
          set -euo pipefail
          docker tag "${SOURCE_IMAGE}@${SOURCE_DIGEST}" "$TARGET_IMAGE"
          timeout --signal=TERM --kill-after=30s 60m docker push "$TARGET_IMAGE" |
            tee "$RUNNER_TEMP/vllm-push.log"
          target_digest="$(sed -nE 's/^.*digest: (sha256:[0-9a-f]{64}).*$/\1/p' "$RUNNER_TEMP/vllm-push.log" | tail -n 1)"
          [[ "$target_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "TARGET_DIGEST=$target_digest" >> "$GITHUB_ENV"

      - name: 核验目标镜像内容
        shell: bash
        run: |
          set -euo pipefail
          # 从目标 Registry 按刚发布的摘要读取，校验内容与源镜像一致。
          timeout 10m docker pull --platform linux/amd64 "${TARGET_IMAGE}@${TARGET_DIGEST}"
          target_id="$(docker image inspect "${TARGET_IMAGE}@${TARGET_DIGEST}" --format '{{.Id}}')"
          [[ "$target_id" == "$SOURCE_IMAGE_ID" ]]
          {
            echo "### vLLM 镜像同步完成"
            echo
            echo "- 源镜像：\`${SOURCE_IMAGE}\`"
            echo "- 目标镜像：\`${TARGET_IMAGE}\`"
            echo "- 源摘要：\`${SOURCE_DIGEST}\`"
            echo "- 目标摘要：\`${TARGET_DIGEST}\`"
            echo "- 内容 ID：\`${target_id}\`"
            echo "- 架构：\`linux/amd64\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 清理临时认证文件
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/vllm-docker-config/config.json"
